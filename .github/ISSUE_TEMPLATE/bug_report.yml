name: 🐛 Reportar un error
description: Algo de la tienda no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema y qué esperabas que pasara. Si puedes, agrega una captura.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abro la tienda en el celular
        2. Agrego un producto con talla
        3. Al abrir el carrito...
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome en Android, Safari en iPhone, Edge en Windows…
    validations:
      required: true
  - type: textarea
    id: consola
    attributes:
      label: Errores de la consola
      description: Presiona F12 → pestaña Console y copia los mensajes en rojo, si hay.
      render: text
